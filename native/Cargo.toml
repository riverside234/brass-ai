[workspace]
members = ["brass-ai-core", "brass-ai-worker", "brass-ai-inference"]
exclude = ["vendor/brass-upstream-rules"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false

[workspace.dependencies]
brass-ai-core = { path = "brass-ai-core" }
brass-ai-inference = { path = "brass-ai-inference" }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
brass-upstream-rules = { path = "vendor/brass-upstream-rules" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.149"
thiserror = "=2.0.21"
crossbeam-channel = "=0.5.17"
num_enum = "=0.7.3"
fixedbitset = "=0.5.7"
sha2 = "=0.10.9"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
walkdir = "=2.5.0"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }
stats_alloc = "=0.1.10"
slotmap = "=1.1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "unwind"
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"

[profile.bench]
inherits = "release"
debug = 1
strip = "none"
